name: scanner

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub peut retarder certaines executions, c'est normal
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scanner
        run: python3 scanner.py
      - name: Sauvegarder les donnees
        run: |
          git config user.name "meme-scanner"
          git config user.email "meme-scanner@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "releve $(date -u +%FT%TZ)" && git pull --rebase -q && git push -q)
