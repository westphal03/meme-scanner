name: scanner

on:
  schedule:
    - cron: "7,37 * * * *"   # demarre toutes les 30 min ; GitHub peut retarder le depart, la boucle ci-dessous garde le rythme de 5 min
  workflow_dispatch:
    inputs:
      iterations:
        description: "Nombre de releves (un aux 5 minutes). 1 pour un test."
        default: "1"

permissions:
  contents: write
  actions: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Boucle de scan
        env:
          ITER: ${{ github.event.inputs.iterations || '6' }}
        run: |
          git config user.name "meme-scanner"
          git config user.email "meme-scanner@users.noreply.github.com"
          for i in $(seq 1 "$ITER"); do
            start=$(date +%s)
            python3 scanner.py || echo "scanner a echoue (iteration $i)"
            git add data
            git diff --cached --quiet || (git commit -q -m "releve $(date -u +%FT%TZ)" && git pull --rebase -q && git push -q) || echo "push a echoue (iteration $i)"
            [ "$i" -lt "$ITER" ] || break
            left=$((300 - ($(date +%s) - start)))
            [ "$left" -gt 0 ] && sleep "$left"
          done
      - name: Relancer (le declencheur planifie de GitHub ne demarre pas : le relevé s'enchaine tout seul)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f STOP ] || [ "$(date -u +%Y%m%d)" -gt 20261031 ]; then echo "arret"; exit 0; fi
          gh api -X POST repos/${{ github.repository }}/actions/workflows/scanner.yml/dispatches -f ref=main -f "inputs[iterations]=6"
